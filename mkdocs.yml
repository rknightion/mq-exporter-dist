site_name: mq-exporter-dist
site_description: Install IBM MQ Prometheus or OpenTelemetry exporters on Linux and Windows.
site_url: https://rknightion.github.io/mq-exporter-dist/
repo_url: https://github.com/rknightion/mq-exporter-dist
repo_name: Source on GitHub
edit_uri: ''
strict: true
theme:
  name: null
  custom_dir: site/theme
  static_templates:
    - 404.html
nav:
  - Start here: index.md
  - Exporters:
      - Prometheus: prometheus.md
      - Custom QDEPTHHI build: custom.md
      - OpenTelemetry: otel.md
  - Install:
      - Linux: linux.md
      - RPM packages: rpm.md
      - Windows: windows.md
  - Operate:
      - Configuration: configuration.md
      - Troubleshooting: troubleshooting.md
      - Compatibility: compatibility.md
      - Installation safety: safety.md
      - Report a vulnerability: security.md
plugins:
  - search
markdown_extensions:
  - admonition
  - toc:
      permalink: true
validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    unrecognized_links: warn
    anchors: warn
copyright: Community project. Not affiliated with IBM or Grafana Labs. Provided without warranty.
