site_name: mq-exporter-dist
site_description: Community packaging, installation and compatibility evidence for IBM MQ exporters.
site_url: https://rknightion.github.io/mq-exporter-dist/
repo_url: https://github.com/rknightion/mq-exporter-dist
repo_name: Source on GitHub
edit_uri: ''
strict: true
theme:
  name: mkdocs
  color_mode: light
  user_color_mode_toggle: true
  nav_style: dark
  highlightjs: false
nav:
  - Overview: index.md
  - Exporters:
      - Prometheus: prometheus.md
      - OpenTelemetry: otel.md
  - Compatibility: compatibility.md
  - Safety: safety.md
  - Build and maintain: maintaining.md
  - Validation evidence: evidence.md
  - Release notes: candidate-notes.md
  - v0.1.0 acceptance: release-v0.1.0.md
  - Security: security.md
  - Downloads: https://github.com/rknightion/mq-exporter-dist/releases
markdown_extensions:
  - admonition
  - toc:
      permalink: true
extra_css:
  - assets/style.css
validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    unrecognized_links: warn
    anchors: warn
copyright: Community project. Not affiliated with IBM or Grafana Labs. Provided without warranty.
