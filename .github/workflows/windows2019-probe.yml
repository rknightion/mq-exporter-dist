name: Windows 2019 container probe
on:
  workflow_dispatch:
    inputs:
      install-cycle:
        description: 'Attempt the unmodified installer cycle (requires a guest with Server product identity)'
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: windows2019-probe
  cancel-in-progress: true
jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.58.0'
      - name: Probe Hyper-V isolated Server 2019
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MQ_PROBE_INSTALL_CYCLE: ${{ inputs.install-cycle && '1' || '0' }}
        run: just windows2019-probe
