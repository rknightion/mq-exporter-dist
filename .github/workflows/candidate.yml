name: Candidate release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Candidate version, for example v0.1.0-rc.1'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
          - os: windows-2022
            platform: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.58.0'
      - id: tools
        shell: bash
        run: just ci-tool-versions >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.tools.outputs.go }}
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.tools.outputs.python }}
      - name: Check distribution sources
        if: runner.os == 'Linux'
        run: just check
      - name: Build and inspect exact candidate
        shell: bash
        env:
          DIST_VERSION: ${{ inputs.version }}
          DIST_PLATFORM: ${{ matrix.platform }}
        run: just "build-$DIST_PLATFORM" "$DIST_VERSION"
      - name: Inspect public payload
        shell: bash
        run: just public-check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.58.0'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: candidate-*
          path: dist
          merge-multiple: true
      - run: just release-index
      - run: just public-check
      - run: just publish-check
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
      - name: Publish tested bytes as a prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          DIST_VERSION: ${{ inputs.version }}
          DIST_SHA: ${{ github.sha }}
        run: just publish "$DIST_VERSION" "$DIST_SHA"
