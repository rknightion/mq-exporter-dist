name: Candidate release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Distribution version: native vX.Y.Z, vX.Y.Z-N or vX.Y.Z-N-rc.M (e.g. v6.0.0, v6.0.0-1, v6.0.0-1-rc.2); custom vX.Y.Z-custom-N or vX.Y.Z-custom-N-rc.M builds only the Linux Prometheus archive'
        required: true
        type: string
      publish:
        description: 'Publish archives after successful tests (rc versions are prereleases; false also builds RPMs)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  setup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      track: ${{ steps.classify.outputs.track }}
      matrix: ${{ steps.classify.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: classify
        shell: bash
        env:
          DIST_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          sys.path.insert(0, "build")
          import versions

          track = versions.parse(os.environ["DIST_VERSION"]).track
          if track == "native":
              matrix = {"include": [
                  {"os": "ubuntu-24.04", "platform": "linux", "exporter": "prometheus"},
                  {"os": "windows-2022", "platform": "windows", "exporter": "prometheus"},
                  {"os": "ubuntu-24.04", "platform": "linux", "exporter": "otel"},
                  {"os": "windows-2022", "platform": "windows", "exporter": "otel"},
              ]}
          else:
              matrix = {"include": [{"os": "ubuntu-24.04", "platform": "linux", "exporter": "prometheus"}]}
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("track=" + track + "\n")
              out.write("matrix=" + json.dumps(matrix) + "\n")
          PY
  build:
    needs: setup
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.58.0'
      - id: tools
        shell: bash
        run: just ci-tool-versions >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.tools.outputs.go }}
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.tools.outputs.python }}
      - name: Check distribution sources
        if: runner.os == 'Linux'
        run: just check
      - name: Build and inspect exact candidate
        shell: bash
        env:
          DIST_VERSION: ${{ inputs.version }}
          DIST_PLATFORM: ${{ matrix.platform }}
          DIST_EXPORTER: ${{ matrix.exporter }}
        run: just "build-$DIST_PLATFORM" "$DIST_VERSION" "$DIST_EXPORTER"
      - name: Inspect public payload
        shell: bash
        run: just public-check
      - name: Package unsigned RPM candidate without rebuilding exporter
        if: runner.os == 'Linux' && !inputs.publish && needs.setup.outputs.track == 'native'
        shell: bash
        run: |
          archives=(dist/*linux-amd64.tar.gz)
          test "${#archives[@]}" -eq 1
          just build-rpm "${archives[0]}" "${archives[0]}.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: runner.os == 'Linux' && !inputs.publish && needs.setup.outputs.track == 'native'
        with:
          name: unsigned-rpm-${{ matrix.exporter }}
          path: .work/rpm-candidates/*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-${{ matrix.exporter }}-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
  rpm-check:
    if: ${{ !inputs.publish && needs.setup.outputs.track == 'native' }}
    needs: [setup, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.58.0'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: unsigned-rpm-*
          path: .work/rpm-candidates
          merge-multiple: true
      - name: Validate RPM transactions in EL8 and EL9 userspaces
        run: just test-rpm .work/rpm-candidates
  attest:
    if: ${{ !inputs.publish && !cancelled() && needs.build.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.rpm-check.result) }}
    needs: [build, rpm-check]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: candidate-*
          path: dist
          merge-multiple: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
  publish:
    if: inputs.publish
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.58.0'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: candidate-*
          path: dist
          merge-multiple: true
      - run: just release-index
      - run: just public-check
      - run: just publish-check
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
      - name: Publish tested bytes
        env:
          GH_TOKEN: ${{ github.token }}
          DIST_VERSION: ${{ inputs.version }}
          DIST_SHA: ${{ github.sha }}
        run: just publish "$DIST_VERSION" "$DIST_SHA"
