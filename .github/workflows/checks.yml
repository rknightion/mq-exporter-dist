name: Checks
on:
  push:
    branches: [main]
  pull_request:
    # The acceptance-evidence check reads the pull request body, so it runs in pr-metadata.yml;
    # a body edit does not re-run this workflow.
    types: [opened, reopened, synchronize, ready_for_review]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: just check
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.59.0'
      - id: tools
        run: just ci-tool-versions >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.tools.outputs.docs-python }}
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ steps.tools.outputs.go }}
          cache: false
      - run: just check
      - run: just public-check
  # Pull requests only: the push to main re-lints the same workflow files the pull request linted.
  # ci-success requires it on a pull request and skipped otherwise.
  actionlint:
    if: github.event_name == 'pull_request'
    uses: rknightion/.github/.github/workflows/actionlint.yml@a6e7f83c8fd233841120fc14c0412124a445c306 # v1.35.0
    permissions:
      contents: read

  # zizmor fails a pull request on any finding (enforce); push runs upload SARIF instead.
  zizmor:
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: rknightion/.github/.github/workflows/zizmor.yml@a6e7f83c8fd233841120fc14c0412124a445c306 # v1.35.0
    with:
      enforce: true

  # The lines a pull request adds carry no identifier, email address, public address or credential
  # shape. The reusable fails on any event but pull_request, so it runs on pull requests only.
  # Check run: `privacy-sweep / Privacy sweep`.
  privacy-sweep:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: rknightion/.github/.github/workflows/privacy-sweep.yml@a6e7f83c8fd233841120fc14c0412124a445c306 # v1.35.0

  # Single required status check. Branch protection on `main` requires ONLY this job, so the gate's
  # jobs can be added or renamed without re-touching protection.
  # NOTE: `coverage` is intentionally absent from `needs` — see its comment above.

  # Single aggregate check for the ruleset to require. The jobs that run on every event must
  # succeed; the pull-request-only jobs must succeed on a pull request and are skipped otherwise.
  ci-success:
    name: ci-success
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    if: always()
    needs: [checks, actionlint, zizmor, privacy-sweep]
    # contents/pull-requests read: the folded backlog freeze step below lists the pull request's files.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Require every job to pass
        env:
          EVENT: ${{ github.event_name }}
          CHECKS: ${{ needs.checks.result }}
          ACTIONLINT: ${{ needs.actionlint.result }}
          ZIZMOR: ${{ needs.zizmor.result }}
          PRIVACY_SWEEP: ${{ needs.privacy-sweep.result }}
        run: |
          if [[ "$CHECKS" != "success" || "$ZIZMOR" != "success" ]]; then
            echo "checks: ${CHECKS}, zizmor: ${ZIZMOR}; both must pass on every event"
            exit 1
          fi
          if [[ "$EVENT" == "pull_request" ]]; then
            if [[ "$ACTIONLINT" != "success" || "$PRIVACY_SWEEP" != "success" ]]; then
              echo "actionlint: ${ACTIONLINT}, privacy-sweep: ${PRIVACY_SWEEP}; both must pass on a pull request"
              exit 1
            fi
          elif [[ "$ACTIONLINT" != "skipped" || "$PRIVACY_SWEEP" != "skipped" ]]; then
            echo "actionlint: ${ACTIONLINT}, privacy-sweep: ${PRIVACY_SWEEP}; must be skipped off a pull request"
            exit 1
          fi
      # The Backlog.md board is retired: issues are the queue. A pull request may delete files under
      # backlog/ or move them out, never add or change one there. Folded in here from its own job (a
      # few seconds of work that cost a runner start); it still fails ci-success on any offending file.
      # Reads the file list from the API, so no pull request code is checked out.
      - name: Refuse additions and changes under backlog/
        if: ${{ always() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          set -euo pipefail
          if ! [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ && "$CHANGED_FILES" =~ ^[0-9]+$ ]]; then
            echo "::error title=backlog freeze::the pull request number or file count is malformed"
            exit 1
          fi
          # The pull request files API lists at most 3000 files; refuse rather than check part of a change.
          if (( CHANGED_FILES > 3000 )); then
            echo "::error title=backlog freeze::${CHANGED_FILES} changed files is more than the API lists; split the pull request"
            exit 1
          fi
          offending="$(gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/files?per_page=100" \
            --jq '.[] | select(.status != "removed") | select(.filename | startswith("backlog/")) | "\(.status) \(.filename | @json)"')"
          if [[ -n "$offending" ]]; then
            echo "::error title=backlog freeze::this pull request adds or changes files under backlog/; the board is retired, so file the work as an issue"
            printf '  %s\n' "$offending"
            exit 1
          fi
          echo "No file under backlog/ is added or changed."
