name: CodeQL
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 6 * * 1'
permissions: {}
jobs:
  codeql:
    uses: rknightion/.github/.github/workflows/codeql.yml@8ea95233ce0b1b2880124f745238e8d194524365 # v1.32.1
    with:
      languages: '[{"language":"go","build-mode":"autobuild"},{"language":"python","build-mode":"none"},{"language":"actions","build-mode":"none"}]'
      timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      packages: read
      security-events: write
