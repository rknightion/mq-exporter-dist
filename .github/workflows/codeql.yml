name: CodeQL
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 6 * * 1'
permissions: {}
jobs:
  codeql:
    uses: rknightion/.github/.github/workflows/codeql.yml@9030a1b7d1d6652c0447b4a8e4181923105a0371 # v1.31.11
    with:
      languages: '[{"language":"go","build-mode":"autobuild"},{"language":"python","build-mode":"none"},{"language":"actions","build-mode":"none"}]'
      timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      packages: read
      security-events: write
