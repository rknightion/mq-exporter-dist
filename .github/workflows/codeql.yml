name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 6 * * 1'
permissions:
  contents: read
jobs:
  codeql:
    uses: rknightion/.github/.github/workflows/codeql.yml@d6da1febca63ae05fcefa8b90486d75cef89517e # v1.25.21
    with:
      languages: '[{"language":"go","build-mode":"autobuild"}]'
      fail-on-security-severity: high
    permissions:
      contents: read
      actions: read
      packages: read
      security-events: write
