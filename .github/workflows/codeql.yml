name: CodeQL
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 6 * * 1'
permissions: {}
jobs:
  codeql:
    uses: rknightion/.github/.github/workflows/codeql.yml@47976d7e85fddb1c3c329cc870612b59ac433849 # v1.32.8
    with:
      languages: '[{"language":"go","build-mode":"autobuild"},{"language":"python","build-mode":"none"},{"language":"actions","build-mode":"none"}]'
      timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      packages: read
      security-events: write
