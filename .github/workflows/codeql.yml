name: CodeQL
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 6 * * 1'
permissions: {}
jobs:
  codeql:
    uses: rknightion/.github/.github/workflows/codeql.yml@2408a41ab6687e377b7988063a6ed2c30b91e61d # v1.32.9
    with:
      languages: '[{"language":"go","build-mode":"autobuild"},{"language":"python","build-mode":"none"},{"language":"actions","build-mode":"none"}]'
      timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      packages: read
      security-events: write
