name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 6 * * 1'
permissions:
  contents: read
jobs:
  codeql:
    uses: rknightion/.github/.github/workflows/codeql.yml@e824f0fe32ed4750136f9d39e701cedb1dc3971b # v1.25.28
    with:
      languages: '[{"language":"go","build-mode":"autobuild"}]'
      fail-on-security-severity: high
    permissions:
      contents: read
      actions: read
      packages: read
      security-events: write
