name: CodeQL
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 6 * * 1'
permissions: {}
jobs:
  codeql:
    uses: rknightion/.github/.github/workflows/codeql.yml@55296cba29f55339f74b048e186011e866ea6275 # v1.32.0
    with:
      languages: '[{"language":"go","build-mode":"autobuild"},{"language":"python","build-mode":"none"},{"language":"actions","build-mode":"none"}]'
      timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      packages: read
      security-events: write
