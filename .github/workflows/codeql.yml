name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 6 * * 1'
permissions:
  contents: read
jobs:
  codeql:
    uses: rknightion/.github/.github/workflows/codeql.yml@ad40ccb5b62ef9a31a4f9dfb8165c63f15ddb459 # v1.30.21
    with:
      languages: '[{"language":"go","build-mode":"autobuild"}]'
      fail-on-security-severity: high
    permissions:
      contents: read
      actions: read
      packages: read
      security-events: write
