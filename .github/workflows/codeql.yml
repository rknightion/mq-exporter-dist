name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 6 * * 1'
permissions:
  contents: read
jobs:
  codeql:
    uses: rknightion/.github/.github/workflows/codeql.yml@2c2a3771006d75783f612a61a2bd406449a3410f # v1.25.11
    with:
      languages: '[{"language":"go","build-mode":"autobuild"}]'
      fail-on-security-severity: high
    permissions:
      contents: read
      actions: read
      packages: read
      security-events: write
