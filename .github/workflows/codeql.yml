name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 6 * * 1'
permissions:
  contents: read
jobs:
  codeql:
    uses: rknightion/.github/.github/workflows/codeql.yml@36b5178e7fac9278288b7a5ded0f1fc4c9deb7f5 # v1.30.24
    with:
      languages: '[{"language":"go","build-mode":"autobuild"}]'
      fail-on-security-severity: high
    permissions:
      contents: read
      actions: read
      packages: read
      security-events: write
